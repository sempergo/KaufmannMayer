# Veröffentlicht site/ auf GitHub Pages (https://sempergo.github.io/KaufmannMayer/) – als Vorschau,
# für Suchmaschinen gesperrt. Live geht die Seite weiter über Cloudflare Pages (siehe README).
# Voraussetzung, einmalig im Repo: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [claude/festive-wozniak-w5apvu, main]
    paths: ["site/**", "tools/pages.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Pfade auf den Unterpfad umstellen
        run: python3 tools/pages.py "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
