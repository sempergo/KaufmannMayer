<!doctype html>
<!-- Vorlage für das Vorschaubild beim Teilen (Open Graph, 1200 x 630).
     Erzeugen: node tools/assets/og-bild.js  ->  site/img/og-image.jpg -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; padding: 0 !important; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 28px; }
  .og .panel { height: 100%; padding: 56px 64px; display: flex; flex-direction: column; }
  .og__logo { align-self: flex-start; height: 56px; width: auto; }
  .og .nowrap { white-space: nowrap; }
  .og .hero__title { margin-top: 48px; font: 500 58px/1.08 var(--font-serif); letter-spacing: -0.012em; color: #fff; max-width: 16em; }
  .og__chips { display: flex; gap: 12px; margin-top: auto; }
  .og__chips .chip { font-size: 18px; padding: 8px 18px 8px 14px; }
</style></head>
<body>
<div class="og">
  <div class="panel hero__panel">
    <img class="og__logo" src="/img/logo-3x.webp" alt="">
    <p class="hero__title">Ihre inhabergeführte Hausverwaltung für Frankfurt am Main und das <span class="nowrap">Rhein-Main-Gebiet</span></p>
    <div class="og__chips">
      <span class="chip"><span class="chip__dot"></span>Zertifizierter Verwalter nach § 26a WEG</span>
      <span class="chip"><span class="chip__dot"></span>06145 938481</span>
    </div>
  </div>
</div>
</body></html>
