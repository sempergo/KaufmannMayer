<!doctype html>
<!-- Vorlage für das Vorschaubild beim Teilen (Open Graph, 1200 x 630).
     Erzeugen: node tools/assets/og-bild.js  ->  site/img/og-image.jpg -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; padding: 0; }
  .og { width: 1200px; height: 630px; display: grid; grid-template-rows: 1fr auto; background: #fff; }
  .og__main { padding: 64px 80px 0; }
  .og__logo { height: 64px; width: auto; }
  .og__title { position: relative; margin-top: 64px; padding-left: 36px; font: 500 60px/1.08 var(--font-serif); letter-spacing: -0.012em; color: var(--navy-800); max-width: 15em; }
  .og__title::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 6px; background: var(--orange-500); }
  .og__bar { display: flex; justify-content: space-between; padding: 26px 80px; background: var(--navy-900); color: #fff; font: 600 24px/1.2 var(--font-sans); }
  .og__bar span:last-child { color: var(--orange-300); }
</style></head>
<body>
<div class="og">
  <div class="og__main">
    <img class="og__logo" src="/img/logo-quer-3x.webp" alt="">
    <p class="og__title">Ihre inhabergeführte Hausverwaltung für Frankfurt am Main und das Rhein-Main-Gebiet</p>
  </div>
  <div class="og__bar"><span>Zertifizierter Verwalter nach § 26a WEG</span><span>06145 938481</span></div>
</div>
</body></html>
